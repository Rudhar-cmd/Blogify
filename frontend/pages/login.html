<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Blogify</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <section class="login-section">

        <div class="login-image">

            <img src="../assets/images/login.png" alt="Login Illustration">

        </div>

        <div class="login-container">

            <div class="login-box">

                <h2>Welcome Back</h2>

                <p>Login to continue your blogging journey.</p>

                <form id="loginForm">

                    <div class="input-box">

                        <label>Email</label>

                        <input type="text" id="credential" name="credential" placeholder="Enter your email or username" required>

                    </div>

                    <div class="input-box">

                        <label>Password</label>

                        <input type="password" id="password" placeholder="Enter your password" required>

                    </div>

                    <button type="submit" class="btn primary">
                        Login
                    </button>

                </form>

                <p class="register-link">

                    Don't have an account?

                    <a href="./register.html">
                        Register
                    </a>

                </p>

            </div>

        </div>

    </section>

    <script src="../assets/js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>

</html>
