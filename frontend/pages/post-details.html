<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Details | Blogify</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/post-details.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>

        <div class="top-nav">

            <div class="logo">
                <h2>Blogify</h2>
            </div>

            <nav>

                <ul>

                    <li><a href="home.html">Home</a></li>

                    <li><a href="create-post.html">Create</a></li>

                    <li><a href="profile.html">Profile</a></li>

                    <li><a href="#" id="logoutBtn">Logout</a></li>

                </ul>

            </nav>

        </div>

    </header>




    <section class="post-details">

       

        <img id="postImage" class="thumbnail" src="" alt="Blog Image">

       
        <div class="post-info">

            <span id="postCategory"></span>

            <h1 id="postTitle"></h1>

            <div class="post-meta">
            
                <div class="meta-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path d="M20 21a8 8 0 0 0-16 0" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
            
                    <span id="postAuthor"></span>
                </div>
            
                <div class="meta-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" />
                        <line x1="16" y1="2" x2="16" y2="6" />
                        <line x1="8" y1="2" x2="8" y2="6" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                    </svg>
            
                    <span id="postDate"></span>
                </div>      </div>

        </div>





        <div class="content" id="postContent">

        </div>




        <div class="actions">
        
            <button class="action-btn" id="likeBtn" title="Like">
        
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
                    <path d="M7 10v12" />
                    <path
                        d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" />
                </svg>
        
                <span id="likeCount">0</span>
        
            </button>
        
            <button class="action-btn" onclick="document.getElementById('commentInput').focus()" title="Comments">
        
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
        
                <span id="commentCount">0</span>
        
            </button>
        
            <button class="action-btn" id="shareBtn" title="Share">
        
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
                    <circle cx="18" cy="5" r="3" />
                    <circle cx="6" cy="12" r="3" />
                    <circle cx="18" cy="19" r="3" />
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                </svg>
        
                Share
        
            </button>  
            </div>



            <hr class="divider">
            
            <section class="comments">
            
                <h2>Comments</h2>
            
                <div class="comment-form">
            
                    <textarea id="commentInput" placeholder="Write your comment..."></textarea>
            
                    <button id="commentBtn">
                        Post Comment
                    </button>
            
                </div>
            
                <div id="commentContainer">
            
                    <!-- Comments will be inserted here dynamically -->
            
                </div>
            
            </section>
            </section>

    <footer class="footer">

        <div class="footer-content">

            <h2>Blogify</h2>

            <p>Read. Write. Inspire.</p>

            <small>

                © 2026 Blogify. All Rights Reserved.

            </small>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="../assets/js/post-details.js"></script>

</body>

</html>
